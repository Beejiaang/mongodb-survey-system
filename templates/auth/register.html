{% extends "auth/layout.html" %}
{% block intro_title %}让好奇，<br>有一个开始。{% endblock %}
{% block form_content %}
<p class="eyebrow form-eyebrow">开始使用</p>
<h2 id="form-title">创建你的账号</h2>
<p class="form-subtitle">已经有账号？<a href="{{ url_for('auth.login') }}">去登录 <span aria-hidden="true">↗</span></a></p>
{% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('auth.register') }}" class="account-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="username">用户名</label><input id="username" name="username" type="text" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-help" required><p class="field-help" id="username-help">3～30 位英文字母、数字或下划线，英文字母统一为小写。</p></div>
    <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-help" required><p class="field-help" id="password-help">密码区分大小写，首尾空格也会保留。</p></div>
    <div class="field"><label for="confirm_password">确认密码</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
    <button class="button full-width" type="submit">创建账号 <span aria-hidden="true">→</span></button>
</form>
<p class="form-footnote">注册完成后，使用你的账号登录。</p>
{% endblock %}
